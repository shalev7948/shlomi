<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>פרופיל</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top center,
#1b245f 0%,
#0f1238 20%,
#06081f 55%,
#02030d 100%);
color:white;
min-height:100vh;
}

.container{
max-width:900px;
margin:auto;
padding:50px 20px;
}

.profile-card{
background:#111633;
border-radius:20px;
padding:30px;
text-align:center;
}

.avatar{
width:140px;
height:140px;
border-radius:50%;
background:#4f7cff;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
margin:auto;
margin-bottom:20px;
}

.username{
font-size:2rem;
margin-bottom:10px;
}

.role{
opacity:.8;
margin-bottom:25px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:30px;
}

.stat{
background:#1b2147;
padding:20px;
border-radius:15px;
}

.stat h2{
color:#7ea0ff;
}

.btn{
display:inline-block;
margin-top:30px;
padding:12px 25px;
background:#4f7cff;
border-radius:10px;
color:white;
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<div class="profile-card">

<div class="avatar">
👤
</div>

<div class="username">
משתמש
</div>

<div class="role">
חבר בקהילת סאב ללא שם
</div>

<div class="stats">

<div class="stat">
<h2>0</h2>
<p>תגובות</p>
</div>

<div class="stat">
<h2>0</h2>
<p>מועדפים</p>
</div>

<div class="stat">
<h2>0</h2>
<p>צפיות</p>
</div>

</div>

<a href="index.html" class="btn">
חזרה לדף הבית
</a>

</div>

</div>

</body>
</html>
