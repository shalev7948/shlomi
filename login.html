<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>התחברות - סאב ללא שם</title>

<style>
body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top center,
#1b245f 0%,
#0f1238 20%,
#06081f 55%,
#02030d 100%);
color:white;
}

.login-box{
width:350px;
padding:30px;
background:#111633;
border-radius:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#4f7cff;
color:white;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:.9;
}
</style>
</head>

<body>

<div class="login-box">

<h1>התחברות</h1>

<input type="text" placeholder="שם משתמש">

<input type="password" placeholder="סיסמה">

<button>התחבר</button>

</div>

</body>
</html>
