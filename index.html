<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Creator Hub</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#0f172a;
            color:white;
        }

        header{
            text-align:center;
            padding:80px 20px;
            background:linear-gradient(135deg,#6d28d9,#2563eb);
        }

        h1{
            font-size:3rem;
        }

        .btn{
            display:inline-block;
            margin-top:20px;
            padding:12px 24px;
            background:white;
            color:black;
            text-decoration:none;
            border-radius:10px;
        }

        .section{
            padding:50px 20px;
            text-align:center;
        }

        .cards{
            display:flex;
            gap:20px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .card{
            width:250px;
            background:#1e293b;
            padding:20px;
            border-radius:15px;
        }
    </style>
</head>

<body>

<header>
    <h1>Anime Creator Hub</h1>
    <p>קהילת יוצרי האנימה הגדולה בישראל</p>
    <a href="#" class="btn">הצטרף עכשיו</a>
</header>

<section class="section">
    <h2>מה יש אצלנו?</h2>

    <div class="cards">
        <div class="card">
            <h3>יצירת דמויות</h3>
            <p>עצב דמויות אנימה משלך</p>
        </div>

        <div class="card">
            <h3>גלריה</h3>
            <p>שתף את היצירות שלך</p>
        </div>

        <div class="card">
            <h3>קהילה</h3>
            <p>מצא יוצרים נוספים</p>
        </div>
    </div>
</section>

</body>
</html>
