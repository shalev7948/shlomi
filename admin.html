<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חדר הנהלה</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top center,
#1b245f 0%,
#0f1238 20%,
#06081f 55%,
#02030d 100%);
color:white;
min-height:100vh;
}

.container{
max-width:1000px;
margin:auto;
padding:40px 20px;
}

h1{
margin-bottom:30px;
text-align:center;
}

.panel{
background:#111633;
padding:25px;
border-radius:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
}

input, textarea{
width:100%;
padding:12px;
border:none;
border-radius:10px;
}

textarea{
resize:vertical;
height:120px;
}

button{
margin-top:20px;
padding:14px 25px;
background:#4f7cff;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.notice{
margin-top:20px;
padding:15px;
background:#1b2147;
border-radius:10px;
}

</style>
</head>
<body>

<div class="container">

<h1>⚙️ חדר הנהלה</h1>

<div class="panel">

<label>שם האנימה</label>
<input type="text" placeholder="לדוגמה: My Anime">

<label>מספר פרק</label>
<input type="number" placeholder="1">

<label>תקציר</label>
<textarea placeholder="תיאור הפרק"></textarea>

<label>תמונת קאבר</label>
<input type="file" accept="image/*">

<label>קובץ וידאו</label>
<input type="file" accept="video/*">

<button>
פרסם פרק
</button>

<div class="notice">
בשלב זה הכפתור עדיין לא מעלה קבצים. בהמשך נחבר אותו ל-Firebase כדי שהפרקים יישמרו באמת.
</div>

</div>

</div>

</body>
</html>
