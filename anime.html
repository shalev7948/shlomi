<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>אנימה</title>

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Heebo',sans-serif;
}

body{
background:
radial-gradient(circle at top center,
#1b245f 0%,
#0f1238 20%,
#06081f 55%,
#02030d 100%);
color:white;
min-height:100vh;
}

header{
padding:25px 7%;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(20px);
background:rgba(0,0,0,.2);
}

.logo{
font-size:2rem;
font-weight:900;
}

.back-btn{
text-decoration:none;
color:white;
padding:10px 18px;
background:#4f7cff;
border-radius:10px;
}

.container{
max-width:1400px;
margin:auto;
padding:40px 7%;
}

.player{
width:100%;
aspect-ratio:16/9;
background:#000;
border-radius:20px;
overflow:hidden;
margin-bottom:30px;
}

.player video{
width:100%;
height:100%;
}

.info{
margin-bottom:40px;
}

.info h1{
font-size:3rem;
margin-bottom:15px;
}

.info p{
opacity:.8;
line-height:1.7;
}

.episodes{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:15px;
margin-top:25px;
}

.episode{
background:#111633;
padding:18px;
text-align:center;
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.episode:hover{
background:#4f7cff;
}

.recommendations{
margin-top:60px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#111633;
border-radius:15px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
}

.card img{
width:100%;
height:280px;
object-fit:cover;
}

.card-content{
padding:15px;
}

</style>
</head>

<body>

<header>

<div class="logo">סאב ללא שם</div>

<a href="index.html" class="back-btn">
חזרה לדף הבית
</a>

</header>

<div class="container">

<div class="player">

<video controls>
<source src="episode1.mp4" type="video/mp4">
</video>

</div>

<div class="info">

<h1>שם האנימה</h1>

<p>
כאן יופיע תקציר האנימה.
אפשר להוסיף תיאור מלא של העלילה,
הדמויות והעונה.
</p>

</div>

<h2>פרקים</h2>

<div class="episodes">

<div class="episode">פרק 1</div>
<div class="episode">פרק 2</div>
<div class="episode">פרק 3</div>
<div class="episode">פרק 4</div>
<div class="episode">פרק 5</div>
<div class="episode">פרק 6</div>

</div>

<div class="recommendations">

<h2 style="margin-bottom:20px;">
אולי תאהב גם
</h2>

<div class="cards">

<div class="card">
<img src="https://picsum.photos/400/600?11">
<div class="card-content">
<h3>אנימה נוספת</h3>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/600?12">
<div class="card-content">
<h3>אנימה נוספת</h3>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/600?13">
<div class="card-content">
<h3>אנימה נוספת</h3>
</div>
</div>

</div>

</div>

</div>

</body>
</html>
